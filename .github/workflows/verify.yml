name: Verify

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript syntax checks
        run: |
          node --check popup.js
          node --check options-continuity.js
      - name: UI maintenance regression tests
        run: node --test tests/ui-maintenance.test.mjs tests/popup-persistence.test.mjs
      - name: Canonical runtime verification
        run: node tools/verify_runtime.js
