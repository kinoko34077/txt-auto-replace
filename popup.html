<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本語表記変換拡張</title>
  <style>
    body {
      margin: 0;
      width: 360px;
      font: 13px/1.4 "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
      background: #f7f2e8;
      color: #1d1a16;
    }
    .shell {
      display: grid;
      gap: 10px;
      padding: 10px;
    }
    .card {
      background: #fffaf1;
      border: 1px solid rgba(124, 45, 18, 0.12);
      border-radius: 12px;
      padding: 10px;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .head h1,
    .head h2 {
      margin: 0;
      font-size: 14px;
    }
    .muted {
      color: #635949;
      font-size: 12px;
    }
    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    input[type="text"],
    input[type="number"] {
      min-width: 0;
      padding: 4px 6px;
      border: 1px solid rgba(29, 26, 22, 0.16);
      border-radius: 8px;
      background: #fff;
      color: inherit;
    }
    .grow {
      flex: 1 1 120px;
    }
    .compact {
      width: 7ch;
    }
    button {
      appearance: none;
      border: 1px solid rgba(29, 26, 22, 0.12);
      border-radius: 8px;
      background: #fff4e0;
      color: inherit;
      padding: 5px 8px;
      cursor: pointer;
    }
    button.primary {
      background: #7c2d12;
      border-color: #7c2d12;
      color: #fff;
    }
    .status {
      min-height: 18px;
      color: #635949;
      font-size: 12px;
    }
    .entry {
      border-top: 1px solid rgba(216, 199, 170, 0.8);
      padding-top: 8px;
      margin-top: 8px;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #635949;
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="card">
      <div class="head">
        <h1>現在サイト</h1>
        <button id="open-options" type="button">詳細設定</button>
      </div>
      <div id="page-context" class="muted"></div>
      <div class="row">
        <label class="toggle">
          <input id="global-enabled" type="checkbox" checked>
          <span>拡張全体ON</span>
        </label>
      </div>
      <div class="row">
        <button id="toggle-site" type="button">現在サイトを無効化</button>
        <button id="toggle-tab" type="button">このタブだけ一時無効</button>
      </div>
    </section>

    <section class="card">
      <div class="head">
        <h2>Popup追加語彙</h2>
      </div>
      <div class="muted" id="selection-preview"></div>
      <div class="row">
        <input id="entry-from" class="grow" type="text" placeholder="置換前">
        <input id="entry-to" class="grow" type="text" placeholder="置換後">
      </div>
      <div class="row">
        <input id="entry-priority" class="compact" type="number" value="90">
        <label class="toggle">
          <input id="entry-enabled" type="checkbox" checked>
          <span>有効</span>
        </label>
        <label class="toggle">
          <input id="entry-regex" type="checkbox">
          <span>正規表現</span>
        </label>
        <label class="toggle">
          <input id="entry-basic" type="checkbox">
          <span>原形一致</span>
        </label>
      </div>
      <div class="row">
        <button id="add-entry" class="primary" type="button">追加</button>
      </div>
      <div id="popup-entries"></div>
    </section>

    <div id="status" class="status" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
