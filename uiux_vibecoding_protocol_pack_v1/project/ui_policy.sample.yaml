target_context: "pc_first_productive_admin_editor"
priority:
  - task_efficiency
  - information_density
  - clear_hierarchy
  - accessibility
  - initial_learnability
rules:
  primary_action:
    max_per_screen: 1
    strongest_style_only_for_primary: true
  labels:
    prefer_short_japanese: true
    avoid_verbose_button_text: true
    remove_unnecessary_suru_suffix: true
    use_tooltip_for_explanation: true
  icons:
    icon_only_allowed_for: "common_recognizable_secondary_actions"
    require_tooltip: true
    require_aria_label: true
  disclosure:
    default_pattern: "chevron_tooltip_aria"
    avoid_verbose_expand_close_buttons: true
  tables:
    prefer_table_when_comparison_is_primary: true
    row_actions_position: "trailing"
  cards:
    avoid_card_grid_for_dense_admin_data: true
  danger:
    separate_from_normal_actions: true
    require_confirm_or_undo: true
